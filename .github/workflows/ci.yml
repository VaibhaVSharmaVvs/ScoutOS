name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      # only the code we keep clean (generated Alembic migrations & scraping code excluded)
      - run: ruff check backend/app ml/models ml/features

  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: . # so repo-root packages `ml`/`etl` import regardless of order
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]" -e "./ml[models]"
      # DB- and artifact-dependent tests skip cleanly in CI; logic/API/passkey
      # tests run. Full integration is exercised against staging (Phase 9).
      - run: pytest backend/tests ml/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
